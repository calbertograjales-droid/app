<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Persianas Elegant House</title>

  <!-- Configuración de la app instalable -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4697b2">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- iPhone -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Elegant House">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #cargando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; z-index: 10;
      font-family: Arial, sans-serif; color: #4697b2; background: #ffffff;
    }
    #cargando img { width: 96px; height: 96px; }
  </style>
</head>
<body>
  <div id="cargando">
    <img src="icon-192.png" alt="">
    <div>Cargando…</div>
  </div>

  <iframe id="app"
          allow="camera; clipboard-read; clipboard-write; fullscreen"
          onload="document.getElementById('cargando').style.display='none'"></iframe>

  <script>
    /* ⚠️ ÚNICO DATO QUE DEBE CAMBIAR:
       pegue entre las comillas el enlace de su aplicativo (el que termina en /exec) */
    var ENLACE_APP = 'https://script.google.com/macros/s/AKfycbwdyHcZzT13RjlSxB2dv_8K-p7lY6Ghr9pJZnBva9ZSr_b--MkujNqqulgKgNX5K6Cd/exec';

    function abrirApp() {
      document.getElementById('cargando').style.display = 'flex';
      var sep = ENLACE_APP.indexOf('?') < 0 ? '?' : '&';
      document.getElementById('app').src = ENLACE_APP + sep + 'modo=app&t=' + Date.now();
    }

    // Al cerrar sesión, el aplicativo pide recargar: se recarga aquí, sin salir de la app
    window.addEventListener('message', function (e) {
      if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
      if (e.data && e.data.tipo === 'eh-recargar') abrirApp();
    });

    abrirApp();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
